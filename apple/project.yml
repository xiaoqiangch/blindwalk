name: Walkaholic
options:
  bundleIdPrefix: com.walkaholic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
    ENABLE_PREVIEWS: YES

targets:
  Walkaholic:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
    dependencies:
      - target: WalkaholicWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkaholic.app
        # Sign in with Apple 需要 **付费 Apple Developer Program**（$99/年）；
        # 免费 Personal Team 不支持该 capability，开启会导致签名失败。
        # 付费账号后取消下面这行注释即可启用：
        # CODE_SIGN_ENTITLEMENTS: Info/Walkaholic.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 步迷
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 步迷需要你的位置，才能判断你是否快到目的地。目的地在你到达前不会显示。
        INFOPLIST_KEY_UIBackgroundModes: location
    info:
      path: Info/Walkaholic-Info.plist
      properties:
        CFBundleDisplayName: 步迷
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 步迷需要你的位置，才能判断你是否快到目的地。目的地在你到达前不会显示。
        NSLocationAlwaysAndWhenInUseUsageDescription: 步迷在散步过程中需要持续定位，才能在你接近目的地时提醒你。
        UIBackgroundModes:
          - location
        NSCameraUsageDescription: 步迷需要用相机拍下你埋下的惊喜，或复刻别人留在这里的那一张。
        NSPhotoLibraryUsageDescription: 步迷需要读取你选的照片，作为埋在某个地方的惊喜。
        # 微信登录：授权回调用自定义 scheme；查询微信是否安装
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.walkaholic.app.wechat
            CFBundleURLSchemes:
              - walkaholic
        LSApplicationQueriesSchemes:
          - weixin
          - weixinULAPI

  WalkaholicWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkaholic.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: 步迷
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.walkaholic.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
    info:
      path: Info/WalkaholicWatch-Info.plist
      properties:
        CFBundleDisplayName: 步迷
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.walkaholic.app
        WKRunsIndependentlyOfCompanionApp: true

schemes:
  Walkaholic:
    build:
      targets:
        Walkaholic: all
    run:
      config: Debug
    test:
      config: Debug
  WalkaholicWatch:
    build:
      targets:
        WalkaholicWatch: all
    run:
      config: Debug
