<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>盲走 · 兴趣点后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5EEE2'/%3E%3Crect x='7' y='13' width='18' height='12' rx='2.6' fill='%23FAEBD7' stroke='%23171410' stroke-width='1.4'/%3E%3Crect x='6' y='10' width='20' height='4.6' rx='1.8' fill='%23F2D8AF' stroke='%23171410' stroke-width='1.4'/%3E%3Ctext x='16' y='23' font-size='11' font-weight='bold' text-anchor='middle' fill='%23C97B2E'%3E%3F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="盲走 · 兴趣点后台">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="5" y="12" width="22" height="15" rx="3.2" fill="#FAEBD7" stroke="#171410" stroke-opacity=".72" stroke-width="1.6"/>
          <rect x="4.2" y="8.4" width="23.6" height="5.2" rx="2.2" fill="#F2D8AF" stroke="#171410" stroke-opacity=".72" stroke-width="1.6"/>
          <path d="M12.6 19.2h.02" stroke="#171410" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__title">盲走 · 兴趣点后台</span>
        <span class="brand__sub">POI Manager · 保密优先</span>
      </span>
    </a>

    <div class="topbar__actions" id="top-actions" aria-label="全局操作"></div>

    <div class="topbar__right">
      <span class="llm-badge" id="llm-badge" role="status" aria-live="polite">
        <span class="llm-badge__dot" aria-hidden="true"></span>
        <span class="llm-badge__text">正在读取大模型状态…</span>
      </span>
    </div>
  </header>

  <main class="workspace">
    <aside class="pane filters" id="filters" aria-label="筛选"></aside>
    <section class="pane listpane" id="listpane" aria-label="兴趣点列表"></section>
    <section class="pane editorpane" id="editorpane" aria-label="编辑面板"></section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div class="modal-root" id="modal-root"></div>

  <script src="mock.js"></script>
  <script src="components/ui.js"></script>
  <script src="components/api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
