<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EEE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="盲走">
<meta name="format-detection" content="telephone=no">
<title>盲走 BlindWalk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="icon" href="icons/app-192.png" sizes="192x192" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="browser">
<div class="stage">
  <div class="device" id="device">
    <div class="device__island" aria-hidden="true"></div>
    <div class="screen" id="screen" data-route="home">

      <header class="statusbar" aria-hidden="true">
        <span id="clock">21:41</span>
        <span class="statusbar__icons">
          <svg width="58" height="12" viewBox="0 0 58 12" fill="none">
            <rect x="0" y="7.2" width="3" height="3.8" rx="1" fill="currentColor"/>
            <rect x="5" y="5.2" width="3" height="5.8" rx="1" fill="currentColor"/>
            <rect x="10" y="2.8" width="3" height="8.2" rx="1" fill="currentColor"/>
            <rect x="15" y="0.8" width="3" height="10.2" rx="1" fill="currentColor" opacity=".35"/>
            <path d="M25.4 5.1a6.3 6.3 0 0 1 8 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M27.4 7.5a3.4 3.4 0 0 1 4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="29.4" cy="9.9" r="1" fill="currentColor"/>
            <rect x="38.5" y="1.6" width="16.5" height="8.8" rx="2.6" stroke="currentColor" stroke-width="1.2" opacity=".5"/>
            <rect x="40.4" y="3.5" width="10.6" height="5" rx="1.4" fill="currentColor"/>
            <path d="M56.6 5.1v2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
          </svg>
        </span>
      </header>

      <main class="main" id="main"></main>

      <nav class="tabbar" id="tabbar" aria-label="主导航">
        <a class="tab" href="#/home" data-route="/home" aria-label="今日">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.4 12 4l8 5.4v8.9a1.7 1.7 0 0 1-1.7 1.7H5.7A1.7 1.7 0 0 1 4 18.3z"/>
            <path d="M4 9.4h16"/>
            <path d="M9.8 13.1c0-.9.9-1.6 2.1-1.6 1.2 0 2 .7 2 1.5 0 .7-.7 1.1-1.6 1.4-.6.2-.9.5-.9 1"/>
            <circle cx="11.4" cy="16.2" r=".6" fill="currentColor" stroke="none"/>
          </svg>
          <span>今日</span>
          <i class="tab__dot" aria-hidden="true"></i>
        </a>
        <a class="tab" href="#/cards" data-route="/cards" aria-label="图鉴">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8.4" y="3.6" width="10.8" height="14.8" rx="2.2"/>
            <path d="M5.6 7.2v10.7a2.3 2.3 0 0 0 2.3 2.3h7.6" opacity=".55"/>
          </svg>
          <span>图鉴</span>
          <i class="tab__dot" aria-hidden="true"></i>
        </a>
        <a class="tab" href="#/social" data-route="/social" aria-label="圈子">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="8.6" r="3"/>
            <path d="M3.8 19.2c.4-3 2.6-4.6 5.2-4.6s4.8 1.6 5.2 4.6"/>
            <circle cx="17.1" cy="9.7" r="2.2"/>
            <path d="M15.9 15c2.2-.1 3.9 1.2 4.3 3.7" opacity=".65"/>
          </svg>
          <span>圈子</span>
          <i class="tab__dot" aria-hidden="true"></i>
        </a>
        <a class="tab" href="#/profile" data-route="/profile" aria-label="我的">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8.4" r="3.4"/>
            <path d="M5.6 19.4c.6-3.4 3.2-5.2 6.4-5.2s5.8 1.8 6.4 5.2"/>
          </svg>
          <span>我的</span>
          <i class="tab__dot" aria-hidden="true"></i>
        </a>
      </nav>

      <div class="sheet-root" id="sheet-root"></div>
      <div class="overlay-root" id="overlay-root"></div>
      <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>
  <p class="stage__caption" aria-hidden="true">BlindWalk · 盲走 · 原型 390 × 844</p>
</div>

<script src="data.js"></script>
<script src="geo.js"></script>
<script src="app.js"></script>
<script>
/* 装到主屏（standalone）时：隐藏模拟状态栏/设备外框/说明文字，铺满整屏并适配刘海安全区 */
(function () {
  var standalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.matchMedia('(display-mode: fullscreen)').matches ||
    window.navigator.standalone === true;
  if (standalone) document.body.setAttribute('data-mode', 'standalone');

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 离线能力非必需 */ });
    });
  }

  /* 阻止双指缩放，避免误触放大成"网页感" */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>
